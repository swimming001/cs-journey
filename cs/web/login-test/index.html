<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
</head>

<body>

<h2>Login</h2>

<label>
Username:
<input id="username" type="text">
</label>

<br><br>

<label>
Password:
<input id="password" type="password">
</label>

<br><br>

<button id="login">
    Login
</button>


<script>

document
.getElementById("login")
.onclick = function(){

    let username =
        document.getElementById("username").value;

    let password =
        document.getElementById("password").value;


    if(username==="admin" 
       && password==="123456")
    {
        alert("Login success");
    }
    else
    {
        alert("Wrong username or password");
    }

}

</script>


</body>
</html>
